<main class="login">
  <form class="login-card" [formGroup]="form" (ngSubmit)="submit()" novalidate>
    <img class="login-logo" src="logohouse.png" alt="GrupoHouse" />
    <h1>Workflow de remates</h1>
    <p class="login-subtitle">Ingresa con tu cuenta de trabajo.</p>

    @if (errorMessage(); as message) {
      <p #errorBox class="form-error" role="alert" tabindex="-1">{{ message }}</p>
    }

    <label class="field">
      Email
      <input
        type="email"
        formControlName="email"
        autocomplete="username"
        [attr.aria-invalid]="showsError('email')"
        aria-describedby="email-error"
      />
      @if (showsError('email')) {
        <span id="email-error" class="field-error">Ingresa un email válido.</span>
      }
    </label>

    <label class="field">
      Contraseña
      <input
        type="password"
        formControlName="password"
        autocomplete="current-password"
        [attr.aria-invalid]="showsError('password')"
        aria-describedby="password-error"
      />
      @if (showsError('password')) {
        <span id="password-error" class="field-error">Ingresa tu contraseña.</span>
      }
    </label>

    <button type="submit" class="button primary" [disabled]="isSubmitting()">
      {{ isSubmitting() ? 'Ingresando…' : 'Iniciar sesión' }}
    </button>
  </form>
</main>
